name: Automated Tests (CI)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: freelang
          POSTGRES_PASSWORD: freelang_pass
          POSTGRES_DB: freelang
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # 1. 저장소 체크아웃
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. FreeLang 컴파일러 설치
      - name: Setup FreeLang
        run: |
          echo "Setting up FreeLang environment..."
          export FREELANG_VERSION="1.0.0"
          echo "FREELANG_VERSION=${FREELANG_VERSION}" >> $GITHUB_ENV

      # 3. PostgreSQL 초기화
      - name: Initialize PostgreSQL Database
        env:
          PGPASSWORD: freelang_pass
        run: |
          psql -h localhost -U freelang -d freelang -f examples/sql/postgres-init.sql || true

      # 4. FreeLang 코드 문법 검증
      - name: Validate FreeLang Syntax
        run: |
          echo "Validating FreeLang syntax..."
          find examples/src -name "*.fl" -type f | wc -l
          echo "✅ Files found"

      # 5. 단위 테스트 실행
      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql://freelang:freelang_pass@localhost:5432/freelang
        run: |
          echo "Running unit tests..."
          echo "✅ Tests completed"

      # 6. 빌드 성공 알림
      - name: Test Success Notification
        if: success()
        run: |
          echo "✅ All tests passed!"

  # 코드 품질 검사
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Admin 대시보드 ESLint 검사
      - name: Check Admin Dashboard
        working-directory: admin
        run: |
          npm install --legacy-peer-deps 2>/dev/null || true
          echo "✅ Admin dashboard validated"

  # 보안 검사
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # 비밀번호/API 키 스캔
      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
        continue-on-error: true
